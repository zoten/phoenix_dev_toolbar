name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} / LiveView ${{ matrix.live_view || 'locked' }}
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      # Read by mix.exs: overrides the LiveView requirement (empty = published one).
      PDT_LIVE_VIEW: ${{ matrix.live_view }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported: Elixir, OTP and LiveView (ADR 00, ADR 06). This is
          # what covers LiveViewCompat's use of LiveView internals on 1.1.
          - elixir: "1.17"
            otp: "26"
            live_view: "~> 1.1.0"
          # Latest, with the locked LiveView; also runs the strict checks
          - elixir: "1.20"
            otp: "29"
            lint: true
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.live_view || 'locked' }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
        if: ${{ !matrix.live_view }}
      # Resolves the overridden requirement (the lockfile pins the latest LiveView),
      # then fetches the rest: deps.update alone only fetches LiveView (a cold cache).
      - run: mix deps.update phoenix_live_view && mix deps.get
        if: ${{ matrix.live_view }}
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      - if: matrix.lint
        run: mix format --check-formatted
      - if: matrix.lint
        run: mix deps.unlock --check-unused
      - if: matrix.lint
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - if: matrix.lint
        run: mix test.js
      - if: matrix.lint
        run: mix credo --strict
      - if: matrix.lint
        run: mix dialyzer
      - if: matrix.lint
        run: mix docs --warnings-as-errors
      # The README install must compile where the dependency does not exist (ADR 01).
      # Latest row only: the fixture's lockfile pins the latest LiveView, which the
      # minimum row's PDT_LIVE_VIEW override would conflict with.
      - name: Fixture host app compiles in prod and dev
        if: matrix.lint
        working-directory: fixtures/host_app
        run: |
          MIX_ENV=prod mix deps.get
          MIX_ENV=prod mix compile --warnings-as-errors
          MIX_ENV=dev mix deps.get
          MIX_ENV=dev mix compile --warnings-as-errors
      # Boots the fixture (no Ecto): the toolbar is on in dev, absent in prod.
      - name: Fixture host app boots without Ecto
        if: matrix.lint
        working-directory: fixtures/host_app
        run: |
          MIX_ENV=dev mix run check_boot.exs
          MIX_ENV=prod mix run check_boot.exs
      # What Hex would ship: the bundles and docs files in, dev only files out.
      - name: Package contents
        if: matrix.lint
        run: |
          out="$RUNNER_TEMP/pkg"
          mix hex.build --unpack -o "$out"
          for f in priv/static/loader.js priv/static/panel.js priv/static/panel.css \
                   lib/phoenix_dev_toolbar.ex README.md LICENSE CHANGELOG.md; do
            test -f "$out/$f" || { echo "missing from package: $f"; exit 1; }
          done
          for f in examples test dev.exs fixtures assets config; do
            test ! -e "$out/$f" || { echo "must not be in package: $f"; exit 1; }
          done
          find "$out" -type f | sed "s|$out/||" | sort
      # priv/static is committed and shipped: it must match assets/ (ADR 04).
      - if: matrix.lint
        name: Built assets are up to date
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix assets.setup
          mix assets.build
          git diff --exit-code priv/static
